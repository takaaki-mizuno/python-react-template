<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="630"
  viewBox="0 0 1200 630"
  fill="none"
>
  <defs>
    <linearGradient id="card-surface" x1="120" y1="84" x2="1080" y2="546" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#f8fbff" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#dbe2ea" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#f8fafc" />
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.75" />
  <rect x="70" y="70" width="1060" height="490" rx="36" fill="url(#card-surface)" stroke="#dbe2ea" stroke-width="2" />

  <g transform="translate(110 120)">
    <text fill="#2563eb" font-family="Helvetica Neue, Arial, Noto Sans JP, sans-serif" font-size="18" font-weight="700" letter-spacing="2.8">
      PYTHON REACT TEMPLATE
    </text>
    <text fill="#0f172a" font-family="Helvetica Neue, Arial, Noto Sans JP, sans-serif" font-size="44" font-weight="700" x="0" y="74">
      FastAPI と React を、
    </text>
    <text fill="#0f172a" font-family="Helvetica Neue, Arial, Noto Sans JP, sans-serif" font-size="44" font-weight="700" x="0" y="132">
      すぐ動かせる
    </text>
    <text fill="#0f172a" font-family="Helvetica Neue, Arial, Noto Sans JP, sans-serif" font-size="44" font-weight="700" x="0" y="190">
      実用的なモノレポ
    </text>
    <text fill="#475569" font-family="Helvetica Neue, Arial, Noto Sans JP, sans-serif" font-size="24" x="0" y="244">
      backend と frontend の責務を分けつつ、build と配信、計画駆動、
    </text>
    <text fill="#475569" font-family="Helvetica Neue, Arial, Noto Sans JP, sans-serif" font-size="24" x="0" y="280">
      品質ゲートまでひとつに揃えた開発基盤です。
    </text>

    <g transform="translate(0 336)">
      <circle cx="8" cy="8" r="8" fill="#2563eb" />
      <text fill="#0f172a" font-family="Helvetica Neue, Arial, Noto Sans JP, sans-serif" font-size="24" x="32" y="16">
        backend / frontend の責務を分離
      </text>
    </g>
    <g transform="translate(0 386)">
      <circle cx="8" cy="8" r="8" fill="#2563eb" />
      <text fill="#0f172a" font-family="Helvetica Neue, Arial, Noto Sans JP, sans-serif" font-size="24" x="32" y="16">
        frontend build を backend/static/ に集約
      </text>
    </g>
    <g transform="translate(0 436)">
      <circle cx="8" cy="8" r="8" fill="#2563eb" />
      <text fill="#0f172a" font-family="Helvetica Neue, Arial, Noto Sans JP, sans-serif" font-size="24" x="32" y="16">
        計画駆動と品質ゲートを最初から定義
      </text>
    </g>
  </g>

  <g transform="translate(858 165)">
    <rect x="-78" y="-78" width="236" height="236" rx="44" fill="#ffffff" stroke="#dbe2ea" stroke-width="2" />
    <rect x="-24" y="-8" width="64" height="42" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="6" />
    <rect x="-24" y="108" width="64" height="42" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="6" />
    <rect x="86" y="50" width="68" height="46" rx="10" fill="#eef4ff" stroke="#2563eb" stroke-width="7" />
    <path
      d="M61 16V129M40 13H61M40 129H61M61 72H86"
      stroke="#2563eb"
      stroke-width="10"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <text
    x="910"
    y="525"
    fill="#475569"
    font-family="Helvetica Neue, Arial, Noto Sans JP, sans-serif"
    font-size="20"
  >
    python-react-template
  </text>
</svg>
