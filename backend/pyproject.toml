[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.128.0",
    "greenlet>=3.3.0",
    "injector>=0.24.0",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.1",
    "sqlalchemy>=2.0.45",
    "sqlmodel>=0.0.31",
    "typer>=0.21.1",
]

[dependency-groups]
dev = [
    "isort>=7.0.0",
    "mypy>=2.3.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.16.1",
    "yapf>=0.43.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [
    ".",
]
markers = [
    "integration: PostgreSQL-backed API and persistence tests",
]

[tool.isort]
known_third_party = ["alembic"]
skip_glob = ["alembic/versions/*.py"]
line_length = 100

[tool.yapf]
based_on_style = "pep8"
column_limit = 100

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "SIM"]
ignore = []

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Body",
]

[tool.ruff.lint.per-file-ignores]
"app/models/__init__.py" = ["E402"]
"tests/integration/services/test_unit_of_work.py" = ["SIM117"]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
mypy_path = "."
check_untyped_defs = true
strict_optional = true
warn_unused_ignores = true
disable_error_code = ["type-abstract"]
