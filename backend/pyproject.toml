[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.128.0",
    "greenlet>=3.3.0",
    "injector>=0.24.0",
    "pwdlib[argon2]>=0.3.0",
    "python-dotenv>=1.2.1",
    "sqlalchemy>=2.0.45",
    "sqlmodel>=0.0.31",
    "typer>=0.21.1",
]

[dependency-groups]
dev = [
    "isort>=7.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "yapf>=0.43.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [
    ".",
]
markers = [
    "integration: PostgreSQL-backed auth tests",
]

[tool.isort]
known_third_party = ["alembic"]
skip_glob = ["alembic/versions/*.py"]
