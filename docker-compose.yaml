services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./docker/postgres/data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-dev
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/app
    working_dir: /app/backend
    command:
      - sh
      - -c
      - uv sync --frozen --group dev && uv run python manage.py db-upgrade && uv run python manage.py serve --host 0.0.0.0 --port 8000 --reload
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app/backend
      - /app/backend/.venv
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/healthz', timeout=2).read()"
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    image: node:22-bookworm-slim
    working_dir: /app/frontend
    environment:
      VITE_BACKEND_ORIGIN: http://backend:8000
    command:
      - sh
      - -c
      # Keep the named node_modules volume in sync with package-lock.json.
      # Rebuilt images do not refresh this volume, so skipping npm ci can leave
      # newly added dependencies missing at Vite import-analysis time.
      - npm ci && npm run dev -- --host 0.0.0.0
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules

volumes:
  frontend_node_modules:
